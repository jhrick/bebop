services:
  harness:
    build:
      context: ${BEBOP_CONFIG_DIR}
      dockerfile: Dockerfile
      args:
        USER_ID: ${BEBOP_UID}
        GROUP_ID: ${BEBOP_GID}

    image: bebop/opencode:local
    container_name: ${BEBOP_CONTAINER_NAME}

    working_dir: /workspace
    command: ["sleep", "infinity"]

    init: true
    stdin_open: true
    tty: true

    user: "${BEBOP_UID}:${BEBOP_GID}"

    volumes:
      - type: bind
        source: ${BEBOP_PROJECT_DIR}
        target: /workspace

      - type: volume
        source: opencode-data
        target: /home/node/.local/share

    # OpenCode can write its project files and its persistent data volume.
    # Everything else in the container filesystem remains read-only.
    read_only: true

    tmpfs:
      - /tmp:rw,exec,nosuid,size=256m,mode=1777
      - /home/node/.cache:rw,nosuid,nodev,uid=${BEBOP_UID},gid=${BEBOP_GID},mode=0700
      - /home/node/.config:rw,nosuid,nodev,uid=${BEBOP_UID},gid=${BEBOP_GID},mode=0700
      - /home/node/.local/state:rw,nosuid,nodev,uid=${BEBOP_UID},gid=${BEBOP_GID},mode=0700

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256

    # No Docker socket, host home, SSH directory, or host credentials are mounted.
    # The default bridge network allows outbound HTTPS for model providers and MCPs.

volumes:
  opencode-data:
